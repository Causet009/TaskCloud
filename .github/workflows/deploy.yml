name: Deploy TaskCloud to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: taskcloud-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AZURE_ACCOUNT_NAME: taskcloudnico2026
      AZURE_ACCOUNT_KEY: ${{ secrets.AZURE_ACCOUNT_KEY }}
      AZURE_CONTAINER: media

    steps:
      - name: Desplegar TaskCloud en EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          port: 22
          command_timeout: 15m
          envs: AZURE_ACCOUNT_NAME,AZURE_ACCOUNT_KEY,AZURE_CONTAINER

          script: |
            set -e

            export PATH="/usr/libexec/git-core:$PATH"

            cd /home/ec2-user/TaskCloud

            echo "Comprobando archivos privados..."

            if [ ! -f ".env" ]; then
              echo "ERROR: No existe el archivo .env"
              exit 1
            fi

            if [ ! -d "wallet" ]; then
              echo "ERROR: No existe la carpeta wallet"
              exit 1
            fi

            echo "Configurando variables de Azure en .env..."

            python3 - <<'PY'
            import os
            from pathlib import Path

            env_path = Path(".env")

            nuevas_variables = {
                "AZURE_ACCOUNT_NAME": os.environ.get("AZURE_ACCOUNT_NAME", ""),
                "AZURE_ACCOUNT_KEY": os.environ.get("AZURE_ACCOUNT_KEY", ""),
                "AZURE_CONTAINER": os.environ.get("AZURE_CONTAINER", "media"),
            }

            for clave, valor in nuevas_variables.items():
                if not valor:
                    raise SystemExit(f"Falta configurar {clave}")

            lineas = env_path.read_text().splitlines()

            lineas_filtradas = []
            for linea in lineas:
                if not any(linea.startswith(clave + "=") for clave in nuevas_variables):
                    lineas_filtradas.append(linea)

            for clave, valor in nuevas_variables.items():
                lineas_filtradas.append(f"{clave}={valor}")

            env_path.write_text("\n".join(lineas_filtradas) + "\n")
            PY

            echo "Descargando la última versión desde GitHub..."

            git fetch origin main
            git reset --hard origin/main

            echo "Activando entorno virtual..."

            source venv/bin/activate

            echo "Instalando dependencias..."

            python -m pip install --upgrade pip
            pip install -r requirements.txt

            echo "Comprobando Django..."

            python manage.py check

            echo "Aplicando migraciones..."

            python manage.py migrate --noinput

            echo "Recopilando archivos estáticos..."

            python manage.py collectstatic --noinput

            echo "Reiniciando servicios..."

            sudo systemctl restart gunicorn
            sudo systemctl reload nginx

            sudo systemctl is-active --quiet gunicorn
            sudo systemctl is-active --quiet nginx

            echo "Despliegue completado correctamente"